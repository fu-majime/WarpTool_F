[package]
name = "puppet_geometry"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
name = "puppet_geometry"
crate-type = ["cdylib"]

[dependencies]
aviutl2 = { version = "0.42.0", default-features = false, features = ["filter", "generic", "module"] }
spade = "2"

[dev-dependencies]
mlua = { version = "0.11", features = ["lua51", "vendored"] }
